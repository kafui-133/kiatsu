<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>気圧ずつう予報</title>
<meta name="theme-color" content="#1d2b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="気圧予報">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 一画面のスマホアプリ。上から 現在の状態 → 時間ごとの気圧グラフ(横スクロール) → 3日間のまとめ → 地点検索 */
:root{
  --bg:#eef2f5; --surface:#ffffff; --fg:#1d2b3a; --muted:#5d6e7e; --line:#d5dde4;
  --accent:#2f6f9f;
  --lv0:#3f9b74; --lv1:#d6a419; --lv2:#e2702b; --lv3:#c8343f;
  --lv0bg:#e2f3ea; --lv1bg:#fbf1d3; --lv2bg:#fbe4d6; --lv3bg:#f8dadd;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a22; --surface:#1b2631; --fg:#e6edf3; --muted:#93a4b4; --line:#2c3a47; --accent:#7fb6e0;
  --lv0:#5cc497; --lv1:#e8c04a; --lv2:#f08d4f; --lv3:#ef5d67;
  --lv0bg:#18342a; --lv1bg:#3a3217; --lv2bg:#3d2617; --lv3bg:#41191e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a22; --surface:#1b2631; --fg:#e6edf3; --muted:#93a4b4; --line:#2c3a47; --accent:#7fb6e0;
  --lv0:#5cc497; --lv1:#e8c04a; --lv2:#f08d4f; --lv3:#ef5d67;
  --lv0bg:#18342a; --lv1bg:#3a3217; --lv2bg:#3d2617; --lv3bg:#41191e; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:8px}
.place{flex:1;min-width:0}
.place h1{font-family:var(--display);font-size:20px;margin:0;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place small{color:var(--muted);font-size:12px}
button{font:inherit;color:inherit;cursor:pointer}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.icon-btn:focus-visible,input:focus-visible,.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn svg{width:18px;height:18px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin svg{animation:none}}

.now{border-radius:20px;padding:20px;background:var(--lvbg,var(--surface));display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:center;transition:background .3s}
.face{grid-row:span 2;width:76px;height:76px}
.level{font-family:var(--display);font-weight:900;font-size:30px;line-height:1.1;color:var(--lv,var(--fg))}
.msg{font-size:14px;color:var(--fg)}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--lv,var(--line)) 30%,transparent);font-size:12px;color:var(--muted)}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--mono);font-weight:500;color:var(--fg);font-size:15px}

.card{background:var(--surface);border-radius:16px;padding:14px 0 10px}
.card h2{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0 16px 8px;font-weight:700}
.chartwrap{position:relative}
#axis{position:absolute;left:0;top:0;pointer-events:none}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
canvas{display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:8px 16px 0;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}

.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.day{background:var(--surface);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;gap:4px;border:none;text-align:left;min-width:0}
.day .d{font-size:12px;color:var(--muted)}
.day .chip{align-self:flex-start;font-family:var(--display);font-weight:700;font-size:15px;padding:1px 10px;border-radius:999px;background:var(--lvbg);color:var(--lv)}
.day .t{font-size:12px;color:var(--fg);font-family:var(--mono)}

.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 12px;font:inherit}
.results{display:flex;flex-direction:column;gap:4px}
.results button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.results small{color:var(--muted)}
.err{background:var(--lv3bg);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:13px}
footer{font-size:11.5px;color:var(--muted);line-height:1.7}
footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <header>
    <div class="place"><h1 id="placeName">地点を取得中…</h1><small id="updated">—</small></div>
    <button class="icon-btn" id="btnGps" aria-label="現在地で更新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>現在地
    </button>
  </header>

  <div id="error" class="err" hidden></div>

  <section class="now" id="now" aria-live="polite">
    <svg class="face" id="face" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <div class="level" id="levelText">—</div>
    <div class="msg" id="msgText">気圧データを読み込んでいます</div>
    <div class="stats">
      <div>現在の気圧<b><span id="curP">—</span> hPa</b></div>
      <div>3時間の変化<b id="d3">—</b></div>
      <div>24時間の変化<b id="d24">—</b></div>
    </div>
  </section>

  <section class="card">
    <h2>時間ごとの気圧と注意度</h2>
    <div class="chartwrap"><div class="scroller" id="scroller"><canvas id="chart" height="206"></canvas></div><canvas id="axis"></canvas></div>
    <div class="legend">
      <span style="--c:var(--lv0)">安心</span><span style="--c:var(--lv1)">やや注意</span><span style="--c:var(--lv2)">注意</span><span style="--c:var(--lv3)">警戒</span>
    </div>
  </section>

  <section class="days" id="days"></section>

  <section style="display:flex;flex-direction:column;gap:8px">
    <form class="search" id="searchForm">
      <input id="q" type="search" placeholder="地名で探す（例：那覇、札幌）" autocomplete="off" enterkeyhint="search">
      <button class="icon-btn" type="submit">検索</button>
    </form>
    <div class="results" id="results"></div>
  </section>

  <footer>
    注意度は「直近3時間・6時間の気圧変化の大きさ」から出した目安です（下降は少し重めに判定）。体調の判断は自分の感覚とお医者さんを優先してください。<br>
    気圧データ：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>（地上気圧・1時間ごと）／地名：BigDataCloud
  </footer>
</main>

<script>
const LV = [
  {name:"安心",   msg:"気圧は落ち着いています。", c:"--lv0", bg:"--lv0bg"},
  {name:"やや注意",msg:"少し気圧が動いています。無理せずいきましょう。", c:"--lv1", bg:"--lv1bg"},
  {name:"注意",   msg:"気圧の変化が大きめです。早めの休憩や薬の準備を。", c:"--lv2", bg:"--lv2bg"},
  {name:"警戒",   msg:"気圧が急に変わっています。予定は控えめに。", c:"--lv3", bg:"--lv3bg"},
];
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let state = null; // {times:[Date], p:[], lv:[], score:[], nowIdx}

/* ---- 判定ロジック ---- */
function levelOf(p, i){
  if (i < 3) return {lv:0, score:0};
  const d3 = p[i] - p[i-3];
  const d6 = i >= 6 ? p[i] - p[i-6] : d3;
  let s = Math.max(Math.abs(d3), Math.abs(d6) / 1.6);
  if (d3 < 0) s *= 1.15;           // 下がるときは重め
  const lv = s < 1.0 ? 0 : s < 2.0 ? 1 : s < 3.0 ? 2 : 3;
  return {lv, score:s};
}

/* ---- データ取得 ---- */
async function fetchPressure(lat, lon){
  const u = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=surface_pressure&past_days=1&forecast_days=3&timezone=auto`;
  const r = await fetch(u);
  if (!r.ok) throw new Error("気圧データを取得できませんでした（" + r.status + "）");
  const j = await r.json();
  const times = j.hourly.time.map(t => new Date(t)); // ローカル時刻文字列
  const p = j.hourly.surface_pressure;
  // 現在時刻（地点のタイムゾーン）に一番近いインデックス
  const nowLocal = new Date(Date.now() + (j.utc_offset_seconds + new Date().getTimezoneOffset()*60) * 1000);
  let nowIdx = times.findIndex(t => t > nowLocal) - 1;
  if (nowIdx < 0) nowIdx = 0;
  const res = p.map((_, i) => levelOf(p, i));
  return {times, p, lv: res.map(x=>x.lv), score: res.map(x=>x.score), nowIdx, tz: j.timezone};
}
async function placeName(lat, lon){
  try{
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ja`);
    const j = await r.json();
    return [j.principalSubdivision, j.city || j.locality].filter(Boolean).join(" ") || null;
  }catch(e){ return null }
}

async function load(loc){
  setBusy(true); showError("");
  try{
    if (!loc.name) loc.name = await placeName(loc.lat, loc.lon) || `${loc.lat.toFixed(2)}, ${loc.lon.toFixed(2)}`;
    $("placeName").textContent = loc.name;
    state = await fetchPressure(loc.lat, loc.lon);
    store.set("loc", loc);
    render();
    const n = new Date();
    $("updated").textContent = `${n.getHours()}:${String(n.getMinutes()).padStart(2,"0")} 更新`;
  }catch(e){ showError(e.message || String(e)) }
  setBusy(false);
}

function useGps(){
  if (!navigator.geolocation){ showError("この端末では位置情報が使えません。下の検索から地名を選んでください。"); return }
  setBusy(true);
  navigator.geolocation.getCurrentPosition(
    pos => load({lat:+pos.coords.latitude.toFixed(3), lon:+pos.coords.longitude.toFixed(3)}),
    err => { setBusy(false); showError("位置情報を取得できませんでした。ブラウザの位置情報を許可するか、下の検索から地名を選んでください。");
             const last = store.get("loc"); if (last && !state) load(last); else if(!state) load({lat:35.681,lon:139.767,name:"東京都 千代田区"}); },
    {enableHighAccuracy:false, timeout:10000, maximumAge:600000}
  );
}

/* ---- 表示 ---- */
function render(){
  const {p, lv, nowIdx} = state;
  const L = LV[lv[nowIdx]];
  const root = $("now");
  root.style.setProperty("--lv", `var(${L.c})`);
  root.style.setProperty("--lvbg", `var(${L.bg})`);
  $("levelText").textContent = L.name;
  // 先の3時間で上がる場合は予告
  const ahead = Math.max(...lv.slice(nowIdx, nowIdx + 4));
  $("msgText").textContent = ahead > lv[nowIdx] ? `${L.msg} この先3時間で「${LV[ahead].name}」になりそうです。` : L.msg;
  $("curP").textContent = p[nowIdx].toFixed(1);
  const fmt = d => (d > 0 ? "+" : "") + d.toFixed(1);
  $("d3").textContent = nowIdx >= 3 ? fmt(p[nowIdx] - p[nowIdx-3]) : "—";
  $("d24").textContent = nowIdx >= 24 ? fmt(p[nowIdx] - p[nowIdx-24]) : "—";
  drawFace(lv[nowIdx]);
  drawChart();
  renderDays();
}

function drawFace(l){
  const c = `var(${LV[l].c})`;
  const mouth = ["M32 62 Q50 76 68 62","M34 66 Q50 70 66 66","M34 68 L66 68","M32 72 Q50 60 68 72"][l];
  const brow = l >= 2 ? `<path d="M28 34 L42 38 M72 34 L58 38" stroke="${c}" stroke-width="4" stroke-linecap="round"/>` : "";
  const bolt = l === 3 ? `<path d="M80 6 L70 22 L78 22 L68 38" fill="none" stroke="${c}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>` : "";
  $("face").innerHTML = `<circle cx="50" cy="52" r="40" fill="var(--surface)" stroke="${c}" stroke-width="5"/>
    <circle cx="36" cy="46" r="4.5" fill="${c}"/><circle cx="64" cy="46" r="4.5" fill="${c}"/>
    ${brow}<path d="${mouth}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"/>${bolt}`;
}

const DOW = ["日","月","火","水","木","金","土"];
function drawChart(){
  const {times, p, lv, nowIdx} = state;
  const start = Math.max(0, nowIdx - 12);       // 12時間前から
  const n = times.length - start;
  const colW = 22, padL = 44, padR = 16, H = 206, top = 28, plotH = 120, bandY = top + plotH + 20, bandH = 18;
  const W = padL + n * colW + padR;
  const cv = $("chart"), dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + "px"; cv.style.height = H + "px";
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const seg = p.slice(start);
  let mn = Math.floor(Math.min(...seg) - 1), mx = Math.ceil(Math.max(...seg) + 1);
  if (mx - mn < 6){ const m = (mx+mn)/2; mn = Math.floor(m-3); mx = Math.ceil(m+3); }
  const x = i => padL + (i - start) * colW + colW/2;
  const y = v => top + (mx - v) / (mx - mn) * plotH;
  const fg = css("--fg"), muted = css("--muted"), line = css("--line"), accent = css("--accent");
  g.font = `11px ${css("--mono")}`; g.textBaseline = "middle";

  // 横グリッド
  const step = (mx - mn) > 12 ? 4 : 2;
  for (let v = Math.ceil(mn/step)*step; v <= mx; v += step){
    g.strokeStyle = line; g.lineWidth = 1; g.beginPath(); g.moveTo(padL, y(v)); g.lineTo(W - padR, y(v)); g.stroke();
    g.fillStyle = muted; g.textAlign = "right"; g.fillText(v, padL - 6, y(v));
  }
  // 固定の目盛り（横スクロールしても見える）
  const ax = $("axis"); ax.width = padL * dpr; ax.height = H * dpr; ax.style.width = padL + "px"; ax.style.height = H + "px";
  const ga = ax.getContext("2d"); ga.setTransform(dpr,0,0,dpr,0,0);
  ga.fillStyle = css("--surface"); ga.fillRect(0, 0, padL - 2, H);
  ga.font = `11px ${css("--mono")}`; ga.textBaseline = "middle"; ga.textAlign = "right"; ga.fillStyle = muted;
  for (let v = Math.ceil(mn/step)*step; v <= mx; v += step) ga.fillText(v, padL - 8, y(v));
  ga.font = `10px ${css("--body")}`; ga.textAlign = "left"; ga.fillText("hPa", 6, top - 12);
  // 日付区切り・時刻
  g.textAlign = "center";
  for (let i = start; i < times.length; i++){
    const t = times[i], h = t.getHours();
    if (h === 0){
      g.strokeStyle = muted; g.setLineDash([3,3]); g.beginPath(); g.moveTo(x(i)-colW/2, 14); g.lineTo(x(i)-colW/2, bandY+bandH+20); g.stroke(); g.setLineDash([]);
      g.fillStyle = fg; g.textAlign = "left"; g.font = `bold 12px ${css("--body")}`;
      g.fillText(`${t.getMonth()+1}/${t.getDate()}(${DOW[t.getDay()]})`, x(i)-colW/2+4, 12);
      g.font = `11px ${css("--mono")}`; g.textAlign = "center";
    }
    if (h % 3 === 0){ g.fillStyle = muted; g.fillText(h, x(i), bandY + bandH + 12); }
    // 注意度の帯
    g.fillStyle = css(LV[lv[i]].c);
    g.globalAlpha = i < nowIdx ? 0.45 : 1;
    g.fillRect(x(i) - colW/2 + 1, bandY, colW - 2, bandH);
    g.globalAlpha = 1;
  }
  // 塗り
  const grad = g.createLinearGradient(0, top, 0, top + plotH);
  grad.addColorStop(0, accent + "55"); grad.addColorStop(1, accent + "00");
  g.beginPath(); g.moveTo(x(start), top + plotH);
  for (let i = start; i < times.length; i++) g.lineTo(x(i), y(p[i]));
  g.lineTo(x(times.length-1), top + plotH); g.closePath();
  g.fillStyle = /^#/.test(accent) ? grad : "transparent"; g.fill();
  // 線
  g.beginPath(); for (let i = start; i < times.length; i++){ i===start ? g.moveTo(x(i), y(p[i])) : g.lineTo(x(i), y(p[i])) }
  g.strokeStyle = accent; g.lineWidth = 2.5; g.lineJoin = "round"; g.stroke();
  // 現在
  g.strokeStyle = fg; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x(nowIdx), top - 4); g.lineTo(x(nowIdx), bandY + bandH); g.stroke();
  g.fillStyle = fg; g.beginPath(); g.arc(x(nowIdx), y(p[nowIdx]), 5, 0, Math.PI*2); g.fill();
  g.font = `bold 11px ${css("--body")}`; g.fillText("いま", x(nowIdx), top - 12 < 18 ? 24 : top - 12);
  // スクロール位置：現在を左寄りに
  $("scroller").scrollLeft = Math.max(0, x(nowIdx) - 130);
}

function renderDays(){
  const {times, lv, nowIdx} = state;
  const today = times[nowIdx];
  const out = [];
  for (let d = 0; d < 3; d++){
    const day = new Date(today.getFullYear(), today.getMonth(), today.getDate() + d);
    const idx = times.map((t,i)=>i).filter(i => times[i].toDateString() === day.toDateString() && (d > 0 || i >= nowIdx));
    if (!idx.length) continue;
    const max = Math.max(...idx.map(i => lv[i]));
    // 注意以上（なければ最大レベル）の時間帯
    const th = Math.max(1, max);
    const hit = idx.filter(i => lv[i] >= th);
    let range = "一日おだやか";
    if (max > 0 && hit.length){
      const a = times[hit[0]].getHours(), b = times[hit[hit.length-1]].getHours() + 1;
      range = `${a}時〜${b}時ごろ`;
    }
    const L = LV[max];
    out.push(`<div class="day" style="--lv:var(${L.c});--lvbg:var(${L.bg})">
      <span class="d">${["今日","明日","明後日"][d]} ${day.getMonth()+1}/${day.getDate()}(${DOW[day.getDay()]})</span>
      <span class="chip">${L.name}</span><span class="t">${range}</span></div>`);
  }
  $("days").innerHTML = out.join("");
}

/* ---- 検索 ---- */
$("searchForm").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("q").value.trim(); if (!q) return;
  $("results").innerHTML = "";
  try{
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=ja&format=json`);
    const j = await r.json();
    if (!j.results?.length){ $("results").innerHTML = `<small>見つかりませんでした。市区町村名で試してください。</small>`; return }
    j.results.forEach(it => {
      const b = document.createElement("button"); b.type = "button";
      const sub = [it.admin1, it.country].filter(Boolean).join("・");
      b.innerHTML = `${it.name} <small>${sub}</small>`;
      b.onclick = () => { $("results").innerHTML = ""; $("q").value = "";
        load({lat:it.latitude, lon:it.longitude, name:[it.admin1, it.name].filter((v,i,a)=>v && a.indexOf(v)===i).join(" ")}); };
      $("results").appendChild(b);
    });
  }catch(err){ showError("地名検索に失敗しました。通信状況を確認してください。") }
});

function setBusy(b){ $("btnGps").classList.toggle("spin", b) }
function showError(m){ $("error").hidden = !m; $("error").textContent = m }
$("btnGps").addEventListener("click", useGps);
window.addEventListener("resize", () => state && drawChart());
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => state && render());
document.addEventListener("visibilitychange", () => { if (!document.hidden && state){ const l = store.get("loc"); l && load(l) } });

/* ---- 起動 ---- */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
const last = store.get("loc");
if (last) load(last); else useGps();
